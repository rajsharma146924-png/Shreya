<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I love you ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/160/heart-suit.png">
    
    <style>
        :root { --pink: #ffafcc; --dark-pink: #fb6f92; --beige-pink: #f7e1e1; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; 
            background-image: url('https://i.postimg.cc/5NRkzD9r/4E4BB03A-C2CF-4C2B-8017-917D5EEA2926.jpg'); 
            background-size: cover; background-position: center;
            font-family: -apple-system, sans-serif; overflow: hidden;
            -webkit-touch-callout: none; -webkit-user-select: none;
        }

        .container {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; width: 100%; height: 100%;
            padding-top: 60px; 
        }

        .instruction { 
            margin-bottom: 25px; color: white; font-weight: bold; 
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6); font-size: 1.4rem;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        .heart-box {
            position: relative; width: 300px; height: 260px;
            cursor: pointer; perspective: 1000px;
            animation: heartbeat 2.5s infinite ease-in-out;
        }

        .heart-box.open { animation: none; }

        .heart-box.birthday-mode {
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8));
        }

        .heart-box.birthday-mode .card {
            background: linear-gradient(135deg, #ffffff 0%, #fffdf0 100%) !important;
            border: 2px solid #FFD700;
        }

        .confetti {
            position: fixed; width: 10px; height: 10px;
            z-index: 9999; pointer-events: none;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            position: absolute; width: 300px; height: 260px;
            clip-path: path('M150,260 L130,240 C50,180 0,140 0,80 C0,30 40,0 90,0 C120,0 140,20 150,35 C160,20 180,0 210,0 C260,0 300,30 300,80 C300,140 250,180 170,240 L150,260 Z');
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; padding: 45px; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); z-index: 1;
            box-sizing: border-box;
        }

        #secret-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--beige-pink);
            display: none; flex-direction: column; justify-content: center;
            align-items: center; z-index: 1000; text-align: center;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            padding: 20px; box-sizing: border-box;
            opacity: 0; transition: opacity 0.5s ease;
            overflow: hidden;
        }

        #secret-overlay.show { display: flex; opacity: 1; }

        .secret-content {
            transform: scale(0.8);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            width: 100%;
            position: relative;
        }

        #secret-overlay.show .secret-content { transform: scale(1); }

        .handwritten {
            font-family: 'Dancing Script', cursive;
            line-height: 1.6; color: #fb6f92;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.8);
            word-wrap: break-word; margin: 0;
            white-space: pre-line;
        }

        .floating-emoji {
            position: absolute; font-size: 2.2rem;
            animation: float-up 7s infinite linear;
            opacity: 0.4; z-index: 10; pointer-events: none;
        }

        @keyframes float-up {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(360deg); }
        }

        .flap {
            position: absolute; width: 300px; height: 260px; top: 0; left: 0;
            background: var(--pink); z-index: 2;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .left-flap {
            clip-path: path('M150,260 L130,240 C50,180 0,140 0,80 C0,30 40,0 90,0 C120,0 140,20 150,35 L150,260 Z');
            transform-origin: center left;
        }

        .right-flap {
            clip-path: path('M150,260 L150,35 C160,20 180,0 210,0 C260,0 300,30 300,80 C300,140 250,180 170,240 L150,260 Z');
            transform-origin: center right;
        }

        .heart-box.open .left-flap { transform: rotateY(-145deg); opacity: 0.7; }
        .heart-box.open .right-flap { transform: rotateY(145deg); opacity: 0.7; }

        .particle { position: absolute; pointer-events: none; z-index: 100; animation: fly 1.2s ease-out forwards; font-size: 24px; }
        @keyframes fly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; } }
    </style>
</head>
<body>

    <div id="secret-overlay" onclick="closeSecret()">
        <div class="secret-content">
            <h2 class="handwritten" style="font-size: 2.4rem; margin-bottom: 20px;">My Forever Promise</h2>
            <p class="handwritten" style="font-size: 1.7rem; padding: 0 15px;">
                "Shreya, Every heartbeat of mine 
                carries a promise to love you,
                cherish you, and choose you 
                for the rest of my life... ❤️
                To being eachothers safe space 
                FOREVER🫶🏻💕"
            </p>
            <p style="margin-top: 50px; font-size: 0.8rem; opacity: 0.6; font-family: sans-serif; color: #888;">(Tap anywhere to go back)</p>
        </div>
    </div>

    <div class="container">
        <div class="instruction">I love you Shreya ❤️</div>
        <div id="heart-wrapper">
            <div class="heart-box" id="heart" onclick="toggleHeart(this)" ontouchstart="startPress()" ontouchend="endPress()">
                <div class="card">
                    <div id="date-label" style="font-size: 0.75rem; color: var(--dark-pink); margin-bottom: 8px; font-weight: bold;"></div>
                    <div id="note-text" style="color: #444; font-weight: 600; font-size: 1.1rem; line-height: 1.4; font-style: italic;"></div>
                    <div id="signature" style="font-size: 0.9rem; color: var(--dark-pink); margin-top: 15px; font-weight: bold;">— Love, Raj</div>
                </div>
                <div class="flap left-flap"></div>
                <div class="flap right-flap"></div>
            </div>
        </div>
    </div>

    <script>
        const msgs = [
    "A new month begins, and my love for you just keeps reaching new heights.",
    "No matter how busy the world gets, you will always be my favorite n most peaceful thought.",
    "If I could give you one gift, it would be the ability to see yourself through my eyes.",
    "I still get that wonderful, warm feeling in my chest every single time you text me.",
    "My heart is safest whenever it is resting right in your hands, Shreyuuu i loveee you.",
    "Every memory we create together becomes my new favorite treasure.",
    "I love you for your beautiful mind, your kind soul, and the way you care for me.",
    "You are the anchor that keeps me steady and the wings that help me fly.",
    "Every day spent loving you feels like the greatest accomplishment of my life.",
    "You aren't just my present reality, Shreya. You are every single one of my future dreams.",
    "I didn't know how deep my heart could feel until you banged right into it.",
    "You are the spark that keeps me motivated and the peace that lets me rest",
    "Thank you for being the person who truly understands the unspoken thoughts in my heart.",
    "My heart is fully invested in our dreams, our joys, and our ultimate happiness.",
    "No song in this world sounds as sweet as the sound of your voice.",
    "I promise to always stand by your side forever.",
    "You brought colors into my world that I didn't even know existed.",
    "Your presence in my life is a constant reminder of how beautiful the world can truly be.",
    "You are the best decision I have ever made, and I will keep choosing you every day.",
    "Just a little reminder baby you are so incredibly pretty and hot and cute and specially mine.",
    "My soul hasn't stopped smiling since the moment we met.",
    "Your happiness is the most important mission of my life.",
    "I am completely and beautifully caught up in everything you are.",
    "In a crowded room of thousands, my eyes will always search only for you.",
    "You have given me a thousand beautiful reasons to smile every single day.",
    "My love for you isn't just a sentiment; it's a permanent part of who I am.",
    "Thank you for making even the smallest, simplest moments feel so incredibly special.",
    "You are the only person who holds the full map to my entire heart.",
    "You are the reason my smile has been a little brighter and my heart a little lighter lately.",
    "You are my beautiful constant in a world that is always changing.",
    "July is coming to a close, but my obsession with you will never have an end date."
];


        let pressTimer;
        function startPress() { pressTimer = window.setTimeout(showSecret, 800); }
        function endPress() { clearTimeout(pressTimer); }

        function showSecret() {
            const overlay = document.getElementById('secret-overlay');
            overlay.style.display = 'flex';
            for(let i=0; i<12; i++) {
                const e = document.createElement('div');
                e.className = 'floating-emoji';
                e.innerText = Math.random() > 0.5 ? '💞' : '🫶🏻';
                const side = Math.random() > 0.5 ? (Math.random() * 15) : (85 + Math.random() * 10);
                e.style.left = side + 'vw';
                e.style.animationDelay = (Math.random() * 5) + 's';
                overlay.appendChild(e);
            }
            setTimeout(() => overlay.classList.add('show'), 10);
        }

        function closeSecret() {
            const overlay = document.getElementById('secret-overlay');
            overlay.classList.remove('show');
            setTimeout(() => {
                overlay.style.display = 'none';
                const emojis = overlay.querySelectorAll('.floating-emoji');
                emojis.forEach(e => e.remove());
            }, 500);
        }

        function init() {
            const today = new Date();
            const dayNum = today.getDate(); 
            const month = today.getMonth(); 

            if (month === 3 && dayNum === 11) {
                document.getElementById('heart').classList.add('birthday-mode');
            }

            document.getElementById('note-text').innerText = msgs[dayNum - 1] || msgs[0];
            document.getElementById('date-label').innerText = today.toLocaleDateString(undefined, {month:'short', day:'numeric'});
        }

        function triggerConfetti() {
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = -10 + 'px';
                c.style.backgroundColor = ['#fb6f92', '#FFD700', '#ffafcc'][Math.floor(Math.random()*3)];
                c.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(c);
                
                const animation = c.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: 'translateY(100vh) rotate(720deg)', opacity: 0 }
                ], { duration: 2000 + Math.random() * 2000 });
                
                animation.onfinish = () => c.remove();
            }
        }

        function createParticle(x, y) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerHTML = Math.random() > 0.5 ? '💗' : '✨';
            p.style.left = x + 'px'; p.style.top = y + 'px';
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 200 + 50;
            p.style.setProperty('--x', Math.cos(angle) * velocity + 'px');
            p.style.setProperty('--y', Math.sin(angle) * velocity + 'px');
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1200);
        }

        function toggleHeart(el) {
            if(document.getElementById('secret-overlay').classList.contains('show')) return;
            
            const today = new Date();
            const isBirthday = (today.getMonth() === 3 && today.getDate() === 11);

            const isOpening = !el.classList.contains('open');
            el.classList.toggle('open');
            
            if (isOpening) {
                if (isBirthday) triggerConfetti();
                const rect = el.getBoundingClientRect();
                for (let i = 0; i < 20; i++) {
                    createParticle(rect.left + rect.width/2, rect.top + rect.height/2);
                }
            }
        }
        init();
    </script>
</body>
</html>
