<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I love you ❤️</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/160/heart-suit.png">
    
    <style>
        :root { 
            --pink-base: #ffb4ca;
            --pink-deep: #fa6b90;
            --rose-accent: #e63946;
            --gold: #f6c860;
            --card-bg: #fffdfc;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; 
            background: #1d0710 url('https://i.postimg.cc/5NRkzD9r/4E4BB03A-C2CF-4C2B-8017-917D5EEA2926.jpg') center/cover no-repeat;
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow: hidden;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }

        body::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(30, 5, 15, 0.2) 0%, rgba(20, 2, 8, 0.75) 100%);
            z-index: 0; pointer-events: none;
        }

        #canvas-bg {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .container {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; width: 100%; height: 100%;
            z-index: 2; padding: 20px;
        }

        .instruction { 
            margin-bottom: 28px; color: #ffffff; font-weight: 700; 
            font-family: 'Dancing Script', cursive;
            text-shadow: 0 2px 15px rgba(0,0,0,0.7), 0 0 30px rgba(250, 107, 144, 0.6); 
            font-size: 2.6rem; letter-spacing: 0.5px;
            animation: pulse-glow 3s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.03); opacity: 1; text-shadow: 0 2px 18px rgba(0,0,0,0.7), 0 0 40px rgba(250, 107, 144, 0.9); }
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.07); }
            28% { transform: scale(1); }
            42% { transform: scale(1.07); }
            70% { transform: scale(1); }
        }

        .heart-box {
            position: relative; width: 310px; height: 270px;
            cursor: pointer; 
            perspective: 1400px;
            animation: heartbeat 2.6s infinite ease-in-out;
            transition: filter 0.4s ease;
            clip-path: path('M155,270 L134,249 C51,186 0,145 0,83 C0,31 41,0 93,0 C124,0 145,20 155,36 C165,20 186,0 217,0 C269,0 310,31 310,83 C310,145 259,186 176,249 L155,270 Z');
        }

        .heart-box.open { animation: none; }

        .hold-ring {
            position: absolute; inset: 0; 
            background: radial-gradient(circle, rgba(255,215,0,0.4) 0%, rgba(250,107,144,0.6) 70%, transparent 100%);
            opacity: 0; transform: scale(0.95);
            transition: transform 0.7s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.3s ease;
            pointer-events: none; z-index: 10;
            clip-path: path('M155,270 L134,249 C51,186 0,145 0,83 C0,31 41,0 93,0 C124,0 145,20 155,36 C165,20 186,0 217,0 C269,0 310,31 310,83 C310,145 259,186 176,249 L155,270 Z');
        }
        .holding .hold-ring {
            opacity: 1; transform: scale(1.05);
            box-shadow: inset 0 0 25px rgba(255, 215, 0, 0.8);
        }

        .heart-box.birthday-mode {
            filter: drop-shadow(0 0 22px rgba(255, 215, 0, 0.85));
        }

        .heart-box.birthday-mode .card {
            background: linear-gradient(145deg, #ffffff 0%, #fffbf0 100%) !important;
            border: 1.5px solid #f6c860;
        }

        .card {
            background: var(--card-bg);
            position: absolute; width: 310px; height: 270px;
            clip-path: path('M155,270 L134,249 C51,186 0,145 0,83 C0,31 41,0 93,0 C124,0 145,20 155,36 C165,20 186,0 217,0 C269,0 310,31 310,83 C310,145 259,186 176,249 L155,270 Z');
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; padding: 38px 28px 52px; text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35); z-index: 1;
        }

        .flap-container {
            position: absolute; inset: 0; width: 310px; height: 270px;
            z-index: 2; pointer-events: none;
            transform-style: preserve-3d;
        }

        .flap {
            position: absolute; width: 310px; height: 270px; top: 0; left: 0;
            background: linear-gradient(135deg, var(--pink-base) 0%, var(--pink-deep) 100%);
            transition: transform 1.1s cubic-bezier(0.15, 0.85, 0.25, 1), opacity 0.7s ease;
            backface-visibility: hidden;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.4);
        }

        .left-flap {
            clip-path: path('M155,270 L134,249 C51,186 0,145 0,83 C0,31 41,0 93,0 C124,0 145,20 155,36 L155,270 Z');
            transform-origin: 0% 50%;
        }

        .right-flap {
            clip-path: path('M155,270 L155,36 C165,20 186,0 217,0 C269,0 310,31 310,83 C310,145 259,186 176,249 L155,270 Z');
            transform-origin: 100% 50%;
        }

        .heart-box.open .left-flap { transform: rotateY(-165deg) rotateZ(-5deg) translateZ(10px); opacity: 0.2; }
        .heart-box.open .right-flap { transform: rotateY(165deg) rotateZ(5deg) translateZ(10px); opacity: 0.2; }

        #date-label {
            font-size: 0.72rem; color: var(--pink-deep);
            margin-bottom: 8px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
        }

        #note-text {
            font-family: 'Playfair Display', serif;
            color: #2c2528; font-weight: 600;
            font-size: 0.98rem; line-height: 1.42;
            font-style: italic; max-height: 120px;
            display: flex; align-items: center; justify-content: center;
        }

        #signature {
            font-size: 0.85rem; color: var(--pink-deep);
            margin-top: 10px; font-weight: 700; letter-spacing: 0.3px;
        }

        #secret-overlay {
            position: fixed; inset: 0; width: 100%; height: 100%;
            background: rgba(253, 242, 244, 0.88);
            display: none; flex-direction: column; justify-content: center;
            align-items: center; z-index: 1000; text-align: center;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 24px; opacity: 0; transition: opacity 0.4s ease;
            overflow: hidden;
        }

        #secret-overlay.show { display: flex; opacity: 1; }

        .secret-content {
            max-width: 440px;
            transform: scale(0.85) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
        }

        #secret-overlay.show .secret-content { transform: scale(1) translateY(0); }

        .handwritten {
            font-family: 'Dancing Script', cursive;
            line-height: 1.5; color: #d6336c;
            text-shadow: 0 1px 2px rgba(255,255,255,0.9);
            margin: 0;
        }

        .floating-emoji {
            position: absolute; font-size: 2rem;
            animation: float-up 6s infinite linear;
            opacity: 0.4; z-index: 10; pointer-events: none;
        }

        @keyframes float-up {
            0% { transform: translateY(105vh) rotate(0deg); }
            100% { transform: translateY(-15vh) rotate(360deg); }
        }

        .particle { 
            position: absolute; pointer-events: none; z-index: 100; 
            animation: fly 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
        }

        @keyframes fly { 
            0% { transform: translate(0,0) scale(1.2); opacity: 1; } 
            100% { transform: translate(var(--x), var(--y)) scale(0.2); opacity: 0; } 
        }

        .confetti {
            position: fixed; width: 9px; height: 9px;
            z-index: 9999; pointer-events: none;
            border-radius: 2px;
        }

        /* --- NEW FEATURES CSS --- */
        
        /* Music Button */
        #music-btn {
            position: fixed; top: 20px; right: 20px;
            font-size: 2rem; cursor: pointer; z-index: 1000;
            background: rgba(255, 255, 255, 0.15);
            padding: 12px; border-radius: 50%;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, background 0.3s ease;
        }
        #music-btn:active { transform: scale(0.9); }
        .playing { animation: spin-slow 4s linear infinite; background: rgba(250, 107, 144, 0.3) !important; }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }

        /* Kiss Counter */
        #kiss-counter {
            position: fixed; bottom: 25px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem; color: #ffb4ca;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            z-index: 100; pointer-events: none;
            opacity: 0.9;
        }

        .kiss-mark {
            position: absolute; font-size: 3rem;
            pointer-events: none; z-index: 50;
            animation: kiss-fade 1.5s ease-out forwards;
            transform: translate(-50%, -50%);
        }
        @keyframes kiss-fade {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* Trail Hearts */
        .trail-heart {
            position: absolute; pointer-events: none; z-index: 40;
            font-size: 1.2rem; transform: translate(-50%, -50%);
            animation: trail-fade 0.8s linear forwards;
        }
        @keyframes trail-fade {
            0% { transform: translate(-50%, -50%) scale(1) translateY(0); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(0.3) translateY(-30px); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- ADD AUDIO FILE HERE -->
    <audio id="bg-music" loop>
        <source src="darkhaast.mp3" type="audio/mpeg">
    </audio>

    <div id="music-btn" onclick="toggleMusic()">🎵</div>

    <div id="kiss-counter">Kisses sent to Raj: <span id="kiss-count-val">0</span></div>

    <canvas id="canvas-bg"></canvas>

    <div id="secret-overlay" onclick="closeSecret()">
        <div class="secret-content">
            <h2 class="handwritten" style="font-size: 2.7rem; font-weight: 700; margin-bottom: 16px;">My Forever Promise</h2>
            <p class="handwritten" style="font-size: 1.9rem; padding: 0 12px;">
                "Shreya, Every heartbeat of mine 
                carries a promise to love you,
                cherish you, and choose you 
                for the rest of my life... ❤️
                To being each other's safe space 
                FOREVER 🫶🏻💕"
            </p>
            <p style="margin-top: 36px; font-size: 0.85rem; opacity: 0.6; color: #777; font-weight: 600;">(Tap anywhere to go back)</p>
        </div>
    </div>

    <div class="container">
        <div class="instruction">I love you Shreya ❤️</div>
        <div id="heart-wrapper">
            <div class="heart-box" id="heart">
                <div class="hold-ring"></div>
                <div class="card">
                    <div id="date-label"></div>
                    <div id="note-text"></div>
                    <div id="signature">— Love, Raj</div>
                </div>
                <div class="flap-container">
                    <div class="flap left-flap"></div>
                    <div class="flap right-flap"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const msgs = [
            "Happy September, my sweet babyy! Ready for 30 more days of me being completely obsessed with you!!",
            "You make my tummy do happy little flips.",
            "I just really, really, really love you. Like, a lotttt.",
            "Just thinking about your cute face makes me smile like an idot.",
            "You are my favorite person to do absolutely everything & nothing with.",
            "Happy Anniversary, princess! Another month of me being the luckiest guy in the whole world. ❤️",
            "I want to give you all the kisses and a giant hug today.",
            "You are the absolute sweetest thing in my life, Shreya ill bite you.",
            "Being with you feels like a warm, fuzzy blanket with the ac on 16.",
            "I’m keeping you forever. No take backs!",
            "You have the cutest giggle I have ever heard & the cutest smile ive ever seen.",
            "Even when you're sleepy and messy, you are so pretty to me.",
            "You make my heart do a silly little happy dance.",
            "I could just stare at you all day long and never get bored.",
            "You are the only one who fills my heart and makes me wanna improve every single day!",
            "Just a quick note to say you are my favorite girl ever.",
            "Every time my phone buzzes, I cross my fingers it’s you.",
            "I love your cute little habbit of making faces so much.",
            "You are my little ray of sunshine, Shreyuu.",
            "My favorite hobby is trying to make you laugh.",
            "I love you to the moon, past all the stars, and back.",
            "You're sweeter than a big box of chocolates and hotter than the sun itself.",
            "I just want to squish you and hold you tight right now.",
            "Life is just so much more fun when you are around.",
            "You are the absolute apple of my eye lets go get apple pie.",
            "Sending you the biggest, tightest virtual hug & touches!",
            "You are my best friend and my biggest crush all in one.",
            "I am so completely and totally crazy about you.",
            "I can't wait to see your pretty face again.",
            "September is over, but my crush on you just keeps getting bigger!"
        ];

        /* --- NEW LOGIC: MUSIC PLAYER --- */
        const bgMusic = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play();
                musicBtn.classList.add('playing');
            } else {
                bgMusic.pause();
                musicBtn.classList.remove('playing');
            }
        }

        /* --- NEW LOGIC: BOOP KISS COUNTER --- */
        let kissCount = localStorage.getItem('shreyaKisses') || 0;
        document.getElementById('kiss-count-val').innerText = kissCount;

        function addKiss(x, y) {
            kissCount++;
            localStorage.setItem('shreyaKisses', kissCount);
            document.getElementById('kiss-count-val').innerText = kissCount;

            const k = document.createElement('div');
            k.className = 'kiss-mark';
            k.innerText = '💋';
            k.style.left = x + 'px';
            k.style.top = y + 'px';
            document.body.appendChild(k);
            setTimeout(() => k.remove(), 1500);
        }

        // Desktop Double Click
        document.addEventListener('dblclick', (e) => {
            if(!e.target.closest('#heart-wrapper') && !e.target.closest('#music-btn')) {
                addKiss(e.pageX, e.pageY);
            }
        });

        // Mobile Double Tap
        let lastTap = 0;
        document.addEventListener('touchend', (e) => {
            if(e.target.closest('#heart-wrapper') || e.target.closest('#music-btn')) return;
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                const touch = e.changedTouches[0];
                addKiss(touch.pageX, touch.pageY);
                e.preventDefault();
            }
            lastTap = currentTime;
        });

        /* --- NEW LOGIC: MAGIC HEART TRAIL --- */
        let lastTrailTime = 0;
        function createTrail(x, y) {
            const now = Date.now();
            if (now - lastTrailTime < 50) return; // Throttle to prevent lagging
            lastTrailTime = now;

            const t = document.createElement('div');
            t.className = 'trail-heart';
            t.innerText = ['✨', '💖', '💕'][Math.floor(Math.random() * 3)];
            t.style.left = x + 'px';
            t.style.top = y + 'px';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 800);
        }

        document.addEventListener('mousemove', (e) => createTrail(e.pageX, e.pageY));
        document.addEventListener('touchmove', (e) => {
            createTrail(e.touches[0].pageX, e.touches[0].pageY);
        }, {passive: true});


        /* --- ORIGINAL BACKGROUND LOGIC --- */
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 35; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 2 + 0.8,
                alpha: Math.random() * 0.5 + 0.2,
                speedY: Math.random() * 0.4 + 0.15,
                drift: Math.random() * 0.3 - 0.15
            });
        }

        function drawAmbientParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 230, ${p.alpha})`;
                ctx.fill();

                p.y -= p.speedY;
                p.x += p.drift;
                if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
            });
            requestAnimationFrame(drawAmbientParticles);
        }
        drawAmbientParticles();

        /* --- ORIGINAL HEART LOGIC --- */
        let pressTimer = null;
        let isLongPressTriggered = false;
        const heartEl = document.getElementById('heart');

        function startPress(e) { 
            if(e.target.closest('#music-btn')) return;
            isLongPressTriggered = false;
            heartEl.classList.add('holding');
            pressTimer = setTimeout(() => {
                isLongPressTriggered = true;
                heartEl.classList.remove('holding');
                if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
                showSecret();
            }, 680); 
        }

        function cancelPress() { 
            heartEl.classList.remove('holding');
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        heartEl.addEventListener('touchstart', startPress, { passive: true });
        heartEl.addEventListener('touchend', cancelPress);
        heartEl.addEventListener('touchmove', cancelPress);
        heartEl.addEventListener('mousedown', startPress);
        heartEl.addEventListener('mouseup', cancelPress);
        heartEl.addEventListener('mouseleave', cancelPress);

        heartEl.addEventListener('click', (e) => {
            if (isLongPressTriggered) {
                isLongPressTriggered = false;
                return;
            }
            toggleHeart(heartEl);
        });

        function showSecret() {
            const overlay = document.getElementById('secret-overlay');
            overlay.style.display = 'flex';
            
            for (let i = 0; i < 14; i++) {
                const e = document.createElement('div');
                e.className = 'floating-emoji';
                e.innerText = Math.random() > 0.5 ? '💞' : '🫶🏻';
                const side = Math.random() > 0.5 ? (Math.random() * 18) : (82 + Math.random() * 12);
                e.style.left = side + 'vw';
                e.style.animationDelay = (Math.random() * 4) + 's';
                e.style.fontSize = (1.6 + Math.random() * 1.2) + 'rem';
                overlay.appendChild(e);
            }
            requestAnimationFrame(() => overlay.classList.add('show'));
        }

        function closeSecret() {
            const overlay = document.getElementById('secret-overlay');
            overlay.classList.remove('show');
            setTimeout(() => {
                overlay.style.display = 'none';
                overlay.querySelectorAll('.floating-emoji').forEach(e => e.remove());
            }, 400);
        }

        function init() {
            const today = new Date();
            const dayNum = today.getDate(); 
            const month = today.getMonth(); 

            if (month === 3 && dayNum === 11) {
                heartEl.classList.add('birthday-mode');
            }

            const currentMsg = msgs[dayNum - 1] || msgs[0];
            const noteTextEl = document.getElementById('note-text');
            noteTextEl.innerText = `“${currentMsg}”`;
            
            if (currentMsg.length > 90) {
                noteTextEl.style.fontSize = '0.84rem';
                noteTextEl.style.lineHeight = '1.35';
            } else if (currentMsg.length > 60) {
                noteTextEl.style.fontSize = '0.92rem';
            }

            document.getElementById('date-label').innerText = today.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function triggerConfetti() {
            const colors = ['#fb6f92', '#FFD700', '#ffafcc', '#ffffff'];
            for (let i = 0; i < 60; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = '-15px';
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                c.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(c);
                
                const anim = c.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(105vh) translateX(${(Math.random() - 0.5) * 80}px) rotate(${360 + Math.random() * 720}deg)`, opacity: 0 }
                ], { 
                    duration: 2200 + Math.random() * 1800,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                });
                
                anim.onfinish = () => c.remove();
            }
        }

        function createParticle(x, y) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerHTML = ['💗', '✨', '💖', '🌸'][Math.floor(Math.random() * 4)];
            p.style.left = x + 'px'; 
            p.style.top = y + 'px';
            p.style.fontSize = (18 + Math.random() * 12) + 'px';

            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 190 + 60;
            p.style.setProperty('--x', Math.cos(angle) * velocity + 'px');
            p.style.setProperty('--y', Math.sin(angle) * velocity + 'px');
            
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1100);
        }

        function toggleHeart(el) {
            if (document.getElementById('secret-overlay').classList.contains('show')) return;
            
            const isOpening = !el.classList.contains('open');
            el.classList.toggle('open');
            
            if (isOpening) {
                if (navigator.vibrate) navigator.vibrate(35);

                const today = new Date();
                if (today.getMonth() === 3 && today.getDate() === 11) {
                    triggerConfetti();
                }

                const rect = el.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                for (let i = 0; i < 22; i++) {
                    createParticle(centerX, centerY);
                }
            }
        }

        init();
    </script>
</body>
</html>
